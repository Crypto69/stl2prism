services:
  stl2prism:
    image: stl2prism:latest
    build:
      context: .
      args:
        # deploy.sh fills these in from git; a plain `docker compose build`
        # leaves them 'unknown'
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    ports:
      - "8321:8000"
    volumes:
      - ./data:/data
    environment:
      # jobs older than this many seconds are deleted automatically
      STL2PRISM_JOB_TTL: "86400"
      # conversions run one at a time; scan repair can peak at several GB
      STL2PRISM_CONCURRENCY: "1"
      # Shells (bodies and their cavities) converted at once inside a job.
      # Two of the NAS's four cores, the rest for the kernel's threads and
      # the NAS's other services. Raise it on a bigger machine by setting
      # STL2PRISM_WORKERS in the environment: measured 2026-09-04 on the
      # 72-shell controller, the body split costs ~2.8 GB once and each
      # extra worker only ~0.5 GB, so four workers converted 13 bodies in
      # 8.7 min at a 4.2 GB peak (12 GB limit). Four on the NAS would still
      # be a poor trade: it has four cores and shares them.
      STL2PRISM_WORKERS: "${STL2PRISM_WORKERS:-2}"
      # seconds a shell may take in a worker before it is built faceted
      # instead (default 900)
      # STL2PRISM_SHELL_TIMEOUT: "900"
      # seconds one shell's extrusion-axis search may take before the best
      # candidate so far is used (default 120; 0 means no limit)
      # STL2PRISM_AXIS_BUDGET: "120"
    # keep a runaway conversion from starving the NAS's other services
    mem_limit: 12g
    restart: unless-stopped
