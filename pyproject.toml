[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stl2prism"
version = "0.1.0"
description = "Convert STL meshes into prismatic STEP solids via extrusion-structure recognition, with a faceted-BREP fallback"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "trimesh",
    "shapely",
    "networkx",
    "rtree",
    "scipy",
    "cadquery",
    "fast-simplification",
]

[project.optional-dependencies]
scan = ["pymeshlab"]

[project.scripts]
stl2prism = "stl2prism.pipeline:main"

[tool.setuptools.packages.find]
include = ["stl2prism*"]
